version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Keep CI aligned with the locally verified version; upgrade deliberately.
        - ZOLA_VERSION=v0.21.0
        - curl --fail --show-error --location --retry 3 "https://github.com/getzola/zola/releases/download/${ZOLA_VERSION}/zola-${ZOLA_VERSION}-x86_64-unknown-linux-musl.tar.gz" -o zola.tar.gz
        - tar -xzf zola.tar.gz
        - chmod +x zola
        - sudo mv zola /usr/local/bin/zola
        - zola --version
    build:
      commands:
        - zola build
  artifacts:
    baseDirectory: public
    files:
      - "**/*"
